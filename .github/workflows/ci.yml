name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers starts Postgres, Redis, and Kafka against the runner's own Docker daemon,
      # so there is no `services:` block here — the tests bring up exactly what they need.
      - name: mvn verify (unit tests via Surefire, Testcontainers ITs via Failsafe)
        run: ./mvnw -B --fail-at-end verify

      - name: Upload coverage (common)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: common/target/site/jacoco/jacoco.xml
          flags: common
          fail_ci_if_error: false

      - name: Upload coverage (identity-service)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: identity-service/target/site/jacoco/jacoco.xml
          flags: identity-service
          fail_ci_if_error: false

      - name: Upload coverage (authz-service)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: authz-service/target/site/jacoco/jacoco.xml
          flags: authz-service
          fail_ci_if_error: false

      - name: Upload coverage (audit-service)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: audit-service/target/site/jacoco/jacoco.xml
          flags: audit-service
          fail_ci_if_error: false

  docker-compose-smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Bring the platform up
        run: docker compose up --build --detach --wait --wait-timeout 300

      # The unit and integration tests prove each service in isolation. This proves the three of
      # them actually talk to each other: a token minted by one is accepted by the next, and the
      # events both produce reach the third.
      - name: Run the cross-service smoke test
        run: ./scripts/smoke-test.sh

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down --volumes
