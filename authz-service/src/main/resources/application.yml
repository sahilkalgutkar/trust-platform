server:
  port: 8082

spring:
  application:
    name: authz-service
  datasource:
    url: ${AUTHZ_DB_URL:jdbc:postgresql://localhost:5432/trust_authz}
    username: ${AUTHZ_DB_USER:trust}
    password: ${AUTHZ_DB_PASSWORD:trust}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; validate so an unapplied migration fails at startup.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

trust:
  authz:
    # What tokens claim as their issuer (compared against `iss`).
    issuer-base-url: ${ISSUER_BASE_URL:http://localhost:8081}
    # Where to actually reach the identity service, when that differs — see AuthzProperties.
    jwks-base-url: ${JWKS_BASE_URL:}
    max-depth: 16
    cache-enabled: ${AUTHZ_CACHE_ENABLED:true}
    cache-ttl: 30s
    jwks-cache-ttl: 10m
    outbox-poll-interval-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
